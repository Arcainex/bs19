<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Arial Narrow","Roboto Condensed",Arial,Helvetica,sans-serif;pointer-events:none}
/* Alpha-Z: warning overlay only. No full-screen filters, rectangles or scanlines. */
#warning{
    position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);
    display:none;width:min(72vw,760px);box-sizing:border-box;
    padding:14px 24px 15px;text-align:center;isolation:isolate;overflow:hidden;
    background:linear-gradient(180deg,rgba(7,24,17,.78),rgba(5,17,13,.70));
    border:1px solid rgba(73,139,91,.66);
    border-left:3px solid rgba(79,169,101,.82);border-right:3px solid rgba(79,169,101,.82);
    box-shadow:inset 0 0 14px rgba(47,112,67,.10),0 4px 20px rgba(0,0,0,.35);
    color:#f4f4f1;font-size:clamp(17px,1.45vw,25px);font-weight:600;
    letter-spacing:.7px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.85);
    opacity:.94;
}
#warning::before{
    content:"ALPHA-Z  //  WARNUNG";display:block;position:relative;z-index:1;
    margin-bottom:7px;color:#8cc69a;font-size:clamp(10px,.72vw,13px);
    font-weight:700;letter-spacing:3px;
}
#warning .hot{color:#ff6060;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.9)}
#warning .warning-copy{position:relative;display:block;z-index:1}
#warning .warning-exact{
    display:block;position:relative;z-index:1;margin-top:9px;
    padding-top:8px;border-top:1px solid rgba(132,202,145,.28);
    font-family:monospace;font-size:clamp(11px,.91vw,15px);
    font-weight:600;letter-spacing:1.3px;color:#b3dbc0;
    text-shadow:0 1px 2px #000;
}
/* Stronger signal interference, strictly inside the warning window. */
#warning::after{
    content:"";pointer-events:none;position:absolute;inset:0;z-index:2;
    background:repeating-linear-gradient(180deg,
      transparent 0px,transparent 4px,rgba(180,236,181,.22) 5px,transparent 6px),
      linear-gradient(90deg,transparent,rgba(185,241,190,.22),transparent);
    mix-blend-mode:screen;opacity:0;
}
/* Chromatic ghost-text tearing; never affects the rest of the screen. */
#warning .warning-copy::after{
    content:attr(data-glitch);position:absolute;inset:0;pointer-events:none;
    white-space:nowrap;color:#d5f2d8;opacity:0;
    text-shadow:-2px 0 rgba(78,209,118,.65),2px 0 rgba(255,74,74,.50);
}
#warning.show{
    display:block;
    animation:alphaWarnPulse 1.2s ease-in-out infinite,
              alphaWarnFlicker 3.1s steps(1,end) infinite,
              alphaWarnFrameJump 4.2s steps(1,end) infinite;
}
#warning.show::after{animation:alphaWarnStatic 1.75s steps(1,end) infinite}
#warning.show .warning-copy::after{animation:alphaWarnGhost 2.05s steps(1,end) infinite}
#warning.show .warning-copy{animation:alphaWarnJitter 2.3s steps(1,end) infinite}
/* Frequent, short receiver glitches without making the warning unreadable. */
@keyframes alphaWarnFrameJump{
    0%,15%,17%,42%,44%,68%,70%,100%{translate:0 0;filter:none}
    15.5%{translate:-2px 1px;filter:brightness(1.6)}
    16%{translate:2px -1px;filter:contrast(1.4)}
    42.5%{translate:3px 0;filter:brightness(.68)}
    43%{translate:-1px 1px;filter:brightness(1.5)}
    68.5%{translate:2px -1px;filter:contrast(1.35)}
    69%{translate:-2px 0;filter:none}
}
@keyframes alphaWarnJitter{
    0%,8%,11%,29%,31%,49%,52%,76%,79%,100%{transform:translateX(0)}
    8.4%,29.4%,49.5%,76.4%{transform:translateX(3px)}
    9%,30%,50.5%,77%{transform:translateX(-3px)}
}
@keyframes alphaWarnPulse{
    0%,100%{border-color:rgba(73,139,91,.57)}
    50%{border-color:rgba(102,183,119,.95)}
}
@keyframes alphaWarnFlicker{
    0%,12%,14%,38%,40%,57%,59%,81%,83%,100%{opacity:.94}
    12.5%,57.5%,81.5%{opacity:.63}
    13.2%,38.7%,58.1%,82.1%{opacity:.83}
}
@keyframes alphaWarnStatic{
    0%,7%,10%,28%,31%,47%,49%,69%,73%,90%,93%,100%{opacity:.06;transform:translateY(0)}
    7.5%,28.5%,47.5%,69.5%,90.5%{opacity:.78;transform:translateY(-4px)}
    9%,30%,48%,72%,92%{opacity:.38;transform:translateY(4px)}
}
@keyframes alphaWarnGhost{
    0%,18%,21%,39%,42%,61%,64%,82%,85%,100%{opacity:0;clip-path:inset(0 0 100% 0);transform:translateX(0)}
    18.5%,39.5%,61.5%,82.5%{opacity:.84;clip-path:inset(8% 0 59% 0);transform:translateX(4px)}
    19.5%,40.5%,62.5%,83.5%{opacity:.60;clip-path:inset(58% 0 11% 0);transform:translateX(-4px)}
}
@media(prefers-reduced-motion:reduce){
    #warning.show,#warning.show::after,#warning.show .warning-copy::after,#warning.show .warning-copy{animation:none}
}
</style>
</head>
<body>
<div id="warning"><span class="warning-copy" id="warningCopy" data-glitch="Ihr habt noch 10 MINUTEN Zeit SCHUTZ zu suchen">Ihr habt noch <span class="hot" id="remainingMinutes">10 MINUTEN</span> Zeit <span class="hot">SCHUTZ</span> zu suchen</span><span id="warningExact" class="warning-exact">Noch 09:56 bis zum vollen Wetterereignis</span></div>
<audio id="alphaSiren" preload="auto" loop src="sounds/sirene.mp3"></audio>
<script>
const WARNING_DISPLAY_MS = 10000; // ten seconds per shelter reminder
const siren = document.getElementById('alphaSiren');
const warning = document.getElementById('warning');
const warningCopy = document.getElementById('warningCopy');
const remainingMinutes = document.getElementById('remainingMinutes');
const warningExact = document.getElementById('warningExact');
siren.loop = true;
siren.preload = 'auto';
let activeToken = null;
let deadline = 0;
let sirenTimer = null;
let warningTimer = null;
let watchdog = null;
let playInFlight = false;
let lastPlayAttempt = 0;
let countdownDeadline = 0;
let countdownTick = null;
let countdownToken = null;
let countdownStep = null;

function hideWarning(){
    if (warningTimer) clearTimeout(warningTimer);
    if (countdownTick) clearInterval(countdownTick);
    warningTimer = null;
    countdownTick = null;
    warning.classList.remove('show');
}
function formatTime(ms){
    const seconds = Math.max(0, Math.ceil(ms / 1000));
    const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
    const ss = String(seconds % 60).padStart(2, '0');
    return `${mm}:${ss}`;
}
function updateCountdown(){
    const remaining = Math.max(0, countdownDeadline - performance.now());
    const minutes = Math.max(1, Math.ceil(remaining / 60000));
    const label = `${minutes} ${minutes === 1 ? 'MINUTE' : 'MINUTEN'}`;
    remainingMinutes.textContent = label;
    warningExact.textContent = `Exakt verbleibend: ${formatTime(remaining)}`;
    warningCopy.dataset.glitch = `Ihr habt noch ${label} Zeit SCHUTZ zu suchen`;
}
function showCountdown(d){
    const token = Number(d.token);
    const step = Number(d.step);
    if (!Number.isFinite(token) || !Number.isFinite(step)) return;
    const remaining = Math.max(0, Number(d.remainingMs) || 0);
    const duration = Math.max(0, Math.min(WARNING_DISPLAY_MS, Number(d.duration) || 0));
    if (remaining <= 0 || duration <= 0) return;
    // One pop-up per token + step; late resends must not restart an open window.
    if (countdownToken === token && countdownStep === step && warning.classList.contains('show')) return;
    hideWarning();
    countdownToken = token;
    countdownStep = step;
    countdownDeadline = performance.now() + remaining;
    updateCountdown();
    warning.classList.add('show');
    countdownTick = setInterval(updateCountdown, 250);
    warningTimer = setTimeout(hideWarning, duration);
}
function stopSiren(){
    if (sirenTimer) clearTimeout(sirenTimer);
    if (watchdog) clearInterval(watchdog);
    sirenTimer = null;
    watchdog = null;
    activeToken = null;
    deadline = 0;
    playInFlight = false;
    lastPlayAttempt = 0;
    try { siren.pause(); siren.currentTime = 0; } catch (_) {}
}
function requestPlay(){
    if (activeToken === null || performance.now() >= deadline) return;
    if (playInFlight && performance.now() - lastPlayAttempt < 1200) return;
    // Some CEF builds pause media during first decode; retry until deadline.
    if (siren.paused || siren.ended || siren.readyState < 2) {
        if (siren.ended) try { siren.currentTime = 0; } catch (_) {}
        playInFlight = true;
        lastPlayAttempt = performance.now();
        Promise.resolve(siren.play()).catch(() => {}).finally(() => { playInFlight = false; });
    }
}
function startSiren(d){
    const token = Number(d.token);
    if (!Number.isFinite(token)) return;
    // Duplicate request on first login must not restart audio or shorten the timer.
    if (activeToken === token) return;
    stopSiren();
    hideWarning();
    const duration = Math.max(0, Number(d.duration) || 56000);
    activeToken = token;
    deadline = performance.now() + duration;
    siren.volume = Math.max(0, Math.min(1, Number(d.volume ?? 0.20)));
    try { siren.currentTime = 0; } catch (_) {}
    siren.load();
    requestPlay();
    watchdog = setInterval(() => {
        if (activeToken === null) return;
        const remaining = deadline - performance.now();
        if (remaining <= 0) { stopSiren(); return; }
        requestPlay();
    }, 250);
    sirenTimer = setTimeout(stopSiren, duration + 100);
    // Warning overlay is controlled by separate server countdown messages.
    // Repeating warnings must never restart the siren.
}
window.addEventListener('message', (event) => {
    const d = event.data || {};
    if (d.action === 'alphaWeatherSirenStart') {
        startSiren(d);
    } else if (d.action === 'alphaWeatherSirenStop') {
        // Reject delayed siren-stop commands; do not touch the countdown window.
        if (activeToken !== null && Number(d.token) === activeToken) {
            stopSiren();
        }
    } else if (d.action === 'alphaWeatherCountdown') {
        showCountdown(d);
    } else if (d.action === 'alphaWeatherCountdownStop') {
        if (countdownToken !== null && Number(d.token) === countdownToken) {
            hideWarning();
            countdownToken = null;
            countdownStep = null;
        }
    }
});
siren.addEventListener('ended', requestPlay);
siren.addEventListener('stalled', requestPlay);
siren.addEventListener('canplay', requestPlay);
// Browser restart/initial stream: ask Lua to replay any still-running warning.
window.addEventListener('load', () => {
    fetch(`https://${GetParentResourceName()}/alphaWeatherReady`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
    }).catch(() => {});
});
</script>
</body>
</html>
