<!DOCTYPE html>
<html lang="en">
<head>
    <script src="nui://bs_ui/html/js/i18n.js?v=20261013a"></script>
<meta charset="utf-8" />
<title>BeyondSurvival - chat</title>
<style>
/* Tokens are copied from bs_ui's root.css because this page is its own ui_page and cannot import it. Keep them in sync. */
:root{
    --soot:#0a0a09; --ash:#14140f;
    --bone:#f0ebdd; --dust:#a8a293;
    --amber:#e08c46; --good:#7fd4a2; --warn:#d9a441; --danger:#b4574a;
    --mono:'Courier New','Consolas',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:var(--mono);color:var(--bone);user-select:none;
    -webkit-font-smoothing:antialiased}

/* The whole thing sits bottom-left, above the HUD's own corner. */
#wrap{position:absolute;left:1.2vw;bottom:22vh;width:34vw;min-width:340px;
    display:flex;flex-direction:column;gap:.35rem}
#wrap.suppressed{display:none!important}

/* Chat backdrop. Off by default in the CSS and switched on by the client. width:max-content makes the panel only as wide as the longest message. */
#log{
    display:flex;flex-direction:column;justify-content:flex-end;gap:.12rem;
    max-height:34vh;overflow-y:auto;overflow-x:hidden;
    padding:.1rem .2rem;
    width:max-content;max-width:100%;border-radius:2px;
    transition:background-color .25s ease;
    /* Scrollable only while the box is open, so the closed log never eats the mouse wheel. */
    pointer-events:none;
}
#wrap.backdrop.has-lines #log{
    /* --chat-bg is the full colour, built in JS: older CEF ignores var() inside rgba(), which left the slider dead */
    background:var(--chat-bg,rgba(10,10,9,.20));
    /* Blur and accent border only while the box is visible (0% = no box at all). */
    /* No backdrop-filter: NUI has no game pixels behind it, so CEF fills the blur with solid black. That was the black box. */
    padding:.35rem .55rem;
    border-left:2px solid var(--chat-edge,rgba(224,140,70,.45));
}
/* An empty log must not draw an empty box. */
#log:empty{background:none!important;backdrop-filter:none!important;
    border-left:0!important;padding:0!important}

#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-thumb{background:rgba(240,235,221,.18)}
#log::-webkit-scrollbar-track{background:transparent}

.line{
    font-size:.86rem;line-height:1.35;letter-spacing:.01em;
    word-wrap:break-word;overflow-wrap:anywhere;
    /* No panel behind the text: a translucent panel takes up screen space, so a hard text shadow is used for contrast instead (same as the HUD). */
    text-shadow:0 1px 1px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.6);
    transition:opacity .5s ease;
    padding:.05rem 0;
}
.line.fading{opacity:0}

.line .tag{color:var(--amber);font-weight:700;margin-right:.4rem}
.line .vipb{font-size:.62rem;letter-spacing:.12em;border:1px solid;padding:0 .3rem;margin-right:.35rem;vertical-align:1px}
.line.sys .tag{color:var(--amber)}
.line.staff .tag{color:var(--warn)}
.line.death{color:var(--danger)}

/* The eight colour codes the stock chat honours; existing code writes ^5[BS] and expects it to work. */
.c1{color:#b4574a}.c2{color:#7fd4a2}.c3{color:#d9a441}.c4{color:#6fa8d0}
.c5{color:#e08c46}.c6{color:#b07fd4}.c7{color:#f0ebdd}.c8{color:#8a4b3f}
.c9{color:#a8a293}

#bar{display:none;align-items:center;gap:.5rem;
    background:linear-gradient(180deg,rgba(20,20,15,.94),rgba(10,10,9,.94));
    border:1px solid rgba(240,235,221,.14);border-left:2px solid var(--amber);
    border-radius:2px;padding:.45rem .6rem;
    box-shadow:0 10px 30px rgba(0,0,0,.55)}
#wrap.open #bar{display:flex}
#wrap.open #log{pointer-events:auto}

#bar .caret{color:var(--amber);font-weight:700}
#entry{flex:1;background:transparent;border:0;outline:0;
    font-family:var(--mono);font-size:.9rem;color:var(--bone);
    caret-color:var(--amber);user-select:text}
#entry::placeholder{color:var(--dust);opacity:.6}
#hint{font-size:.68rem;color:var(--dust);letter-spacing:.08em;
    text-transform:uppercase;white-space:nowrap}

/* Command suggestions, shown while the line starts with a slash. */
#sug{display:none;flex-direction:column;gap:.05rem;
    background:rgba(10,10,9,.94);border:1px solid rgba(240,235,221,.12);
    border-radius:2px;padding:.3rem 0;max-height:26vh;overflow-y:auto}
#wrap.suggesting #sug{display:flex}
.sug{padding:.2rem .6rem;font-size:.78rem;display:flex;gap:.5rem}
.sug.on{background:rgba(224,140,70,.16)}
.sug .cmd{color:var(--amber)}
.sug .desc{color:var(--dust);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
    <div id="log"></div>
    <div id="sug"></div>
    <div id="bar">
        <span class="caret">&gt;</span>
        <input id="entry" maxlength="220" autocomplete="off" spellcheck="false"
               placeholder="say something" data-i18n-attr="placeholder:ui.say_something" />
        <span id="hint" data-i18n="ui.enter_send_esc_cancel">enter send · esc cancel</span>
    </div>
</div>

<script>
'use strict';

const wrap  = document.getElementById('wrap');
const log   = document.getElementById('log');
const entry = document.getElementById('entry');
const sugEl = document.getElementById('sug');

let open = false;
let history = [];          /* what the player has typed, newest last */
let historyAt = -1;
let suggestions = [];      /* { name, help, params } from chat:addSuggestion */
let shown = [];            /* the filtered subset currently on screen */
let sel = 0;

// Resolves true when Lua answered, false when the call failed.
const post = (name, data) =>
    fetch(`https://${GetParentResourceName()}/${name}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data || {})
    }).then(r => r.ok).catch(() => false);

// Script errors go to F8 through Lua, at most one every 3 s.
let lastErrAt = 0;
function reportError(msg) {
    const now = Date.now();
    if (now - lastErrAt < 3000) return;
    lastErrAt = now;
    post('error', { msg: String(msg).slice(0, 300) });
}
window.addEventListener('error', (e) => reportError(`${e.message} (${e.filename || ''}:${e.lineno || 0})`));
window.addEventListener('unhandledrejection', (e) => reportError('promise: ' + (e.reason && e.reason.message || e.reason)));

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// Colour codes: ^1..^9 and ^0/^r reset, like the stock chat. Anything else stays literal text.
function colourise(text) {
    const parts = String(text).split(/(\^[0-9r])/g);
    let out = '', cls = null;

    for (const part of parts) {
        const m = /^\^([0-9r])$/.exec(part);
        if (m) {
            const code = m[1];
            cls = (code === '0' || code === 'r' || code === '7') ? null : 'c' + code;
            continue;
        }
        if (!part) continue;
        out += cls ? `<span class="${cls}">${esc(part)}</span>` : esc(part);
    }
    return out;
}

// lines

const timers = new WeakMap();

// Faded lines stay in the DOM briefly for their opacity transition, so :empty cannot decide on the backdrop. The wrapper tracks what is visible instead.
function syncBackdrop(){
    const hasVisibleLine = Array.from(log.children).some((el) => !el.classList.contains('fading'));
    wrap.classList.toggle('has-lines', open || hasVisibleLine);
}

function addLine(msg) {
    const el = document.createElement('div');
    // channel becomes a class name: letters only, so odd input cannot break the markup
    const channel = /^[a-z]{1,12}$/i.test(msg.channel || '') ? msg.channel : '';
    el.className = 'line' + (channel ? ' ' + channel : '');

    if (Array.isArray(msg.colour) && msg.colour.length >= 3 && msg.colour.slice(0, 3).every(n => Number.isFinite(Number(n)))) {
        el.style.color = `rgb(${msg.colour.slice(0, 3).map(n => Math.max(0, Math.min(255, Number(n)))).join(',')})`;
    }

    // `args` is the stock shape: first element is a tag, the rest is the body. A single element is a bare line with no tag.
    const args = Array.isArray(msg.args) ? msg.args.slice() : [String(msg.args ?? '')];
    let html = '';

    const vip = msg.vip && typeof msg.vip === 'object' ? msg.vip : null;
    const hexOk = (v) => /^#[0-9a-f]{6}$/i.test(v || '');
    if (vip && vip.badge) {
        const c = hexOk(vip.badgeHex) ? vip.badgeHex : '#e08c46';
        html += `<span class="vipb" style="color:${c};border-color:${c}">${colourise(String(vip.badge).replace(/\^/g, ''))}</span>`;
    }
    if (args.length > 1) {
        const style = vip && hexOk(vip.nameHex) ? ` style="color:${vip.nameHex}"` : '';
        html += `<span class="tag"${style}>${colourise(args.shift())}</span>`;
    }
    html += colourise(args.join(' '));

    el.innerHTML = html;
    appendLine(el);
}

// Adds the line, trims the scrollback and starts its fade.
function appendLine(el) {
    log.appendChild(el);

    while (log.children.length > 120) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;

    scheduleFade(el);
    syncBackdrop();
}

// Fade a line out once the box has been closed for `fadeAfter`. Opening the box cancels pending fades (see setOpen).
let fadeAfter = 12000;
let mode = 'fade';          /* 'fade' | 'always' | 'hidden' */

function scheduleFade(el) {
    clearTimeout(timers.get(el));

    // Open or pinned: nothing fades.
    if (open || mode === 'always') { el.classList.remove('fading'); return; }

    // Hidden: lines go as soon as the box closes, no delay.
    if (mode === 'hidden') { el.classList.add('fading'); setTimeout(syncBackdrop, 520); return; }

    timers.set(el, setTimeout(() => { el.classList.add('fading'); setTimeout(syncBackdrop, 520); }, fadeAfter));
}

// Re-evaluate every line against the current mode, so changing the setting also affects lines already on screen.
function applyMode() {
    for (const el of log.children) scheduleFade(el);
    syncBackdrop();
}

// A message that cannot be rendered still shows up, as plain text, instead of being lost or breaking the handler.
function addLineSafe(msg) {
    try {
        addLine(msg);
    } catch (err) {
        reportError('message render failed: ' + (err && err.message));
        try {
            const el = document.createElement('div');
            el.className = 'line';
            el.textContent = (Array.isArray(msg.args) ? msg.args.join(' ') : String(msg.args ?? '')).slice(0, 600);
            appendLine(el);
        } catch (_) { /* nothing more to do for this line */ }
    }
}

function setOpen(state) {
    open = state;
    wrap.classList.toggle('open', open);

    for (const el of log.children) {
        if (open) {
            clearTimeout(timers.get(el));
            el.classList.remove('fading');
        } else {
            scheduleFade(el);
    syncBackdrop();
        }
    }

    if (open) {
        entry.value = '';
        historyAt = -1;
        renderSuggestions();
        setTimeout(() => entry.focus(), 0);
    } else {
        entry.blur();
        wrap.classList.remove('suggesting');
    }

    log.scrollTop = log.scrollHeight;
    syncBackdrop();
}

// suggestions

function renderSuggestions() {
    const text = entry.value;

    if (!text.startsWith('/') || suggestions.length === 0) {
        wrap.classList.remove('suggesting');
        shown = [];
        return;
    }

    const typed = text.slice(1).split(' ')[0].toLowerCase();
    shown = suggestions
        .filter(s => s.name.slice(1).toLowerCase().startsWith(typed))
        .slice(0, 8);

    if (shown.length === 0) {
        wrap.classList.remove('suggesting');
        return;
    }

    if (sel >= shown.length) sel = 0;
    wrap.classList.add('suggesting');
    sugEl.innerHTML = shown.map((s, i) =>
        `<div class="sug ${i === sel ? 'on' : ''}">
            <span class="cmd">${esc(s.name)}${esc(s.params || '')}</span>
            <span class="desc">${esc(s.help || '')}</span>
         </div>`).join('');
}

// input

// Asks Lua to close and drop NUI focus. If Lua does not answer or the box is still open a moment later, close locally and ask again, so the player is never stuck behind an open box.
function closeBox() {
    post('close', {}).then(ok => { if (!ok) setTimeout(() => post('close', {}), 500); });
    setTimeout(() => { if (open) { setOpen(false); post('close', {}); } }, 800);
}

// Escape works even when the click landed on the log and not on the input.
document.addEventListener('keydown', (e) => {
    if (open && e.key === 'Escape' && e.target !== entry) { e.preventDefault(); closeBox(); }
});

entry.addEventListener('input', () => { sel = 0; renderSuggestions(); });

entry.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        const text = entry.value.trim();
        if (text) {
            history.push(text);
            if (history.length > 40) history.shift();
            post('send', { text });
        }
        closeBox();
        return;
    }

    if (e.key === 'Escape') {
        e.preventDefault();
        closeBox();
        return;
    }

    if (e.key === 'Tab' && shown.length > 0) {
        e.preventDefault();
        entry.value = shown[sel].name + ' ';
        renderSuggestions();
        return;
    }

    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();

        // Arrows walk the suggestions while they are shown, otherwise the typing history.
        if (shown.length > 0) {
            sel += (e.key === 'ArrowUp') ? -1 : 1;
            if (sel < 0) sel = shown.length - 1;
            if (sel >= shown.length) sel = 0;
            renderSuggestions();
            return;
        }

        if (history.length === 0) return;
        if (e.key === 'ArrowUp') {
            historyAt = (historyAt < 0) ? history.length - 1 : Math.max(0, historyAt - 1);
        } else {
            historyAt = (historyAt < 0) ? -1 : historyAt + 1;
            if (historyAt >= history.length) { historyAt = -1; entry.value = ''; return; }
        }
        entry.value = history[historyAt] || '';
        setTimeout(() => entry.setSelectionRange(entry.value.length, entry.value.length), 0);
    }
});

// from Lua

window.addEventListener('message', (event) => {
    try {
        handleMessage(event.data || {});
    } catch (err) {
        reportError('handler ' + (event.data && event.data.action) + ': ' + (err && err.message));
    }
});

function handleMessage(d) {
    if (d.action === 'reload')   { location.reload(); return; }
    if (d.action === 'visible')  { wrap.classList.toggle('suppressed', !d.visible); return; }
    if (d.action === 'message')  return addLineSafe(d);
    if (d.action === 'open')     return setOpen(true);
    if (d.action === 'close')    return setOpen(false);
    if (d.action === 'clear')    { log.innerHTML = ''; syncBackdrop(); return; }
    if (d.action === 'config')   { fadeAfter = d.fadeAfter || fadeAfter; return; }

    // Two independent settings: `mode` decides whether lines linger, `backdrop` decides whether there is a panel behind them.
    if (d.action === 'style') {
        mode = d.mode || 'fade';
        wrap.classList.toggle('backdrop', !!d.backdrop);
        if (d.opacity !== undefined && !isNaN(Number(d.opacity))) {
            const op = Math.max(0, Math.min(100, Number(d.opacity))) / 100;
            wrap.style.setProperty('--chat-bg', `rgba(10,10,9,${op})`);
            wrap.style.setProperty('--chat-blur', op > 0 ? '3px' : '0px');
            wrap.style.setProperty('--chat-edge', op > 0 ? 'rgba(224,140,70,.45)' : 'transparent');
        }
        applyMode();
        syncBackdrop();
        return;
    }

    if (d.action === 'suggestions') {
        suggestions = Array.isArray(d.list) ? d.list.filter(s => s && typeof s.name === 'string') : [];
        renderSuggestions();
    }
}

// Tell Lua the listener is up (handshake), so config/style messages are not sent before it exists and dropped.
// Retries every 500 ms until Lua answers, however long the client takes to load. After that the same loop is a heartbeat every 3 s: Lua reloads the page if it goes quiet.
(function announce() {
    let ready = false;
    const tick = async () => {
        let ok = false;
        try { ok = await post(ready ? 'alive' : 'ready', {}); } catch (_) { ok = false; }
        if (ok) ready = true;
        setTimeout(tick, ready ? 3000 : 500);
    };
    tick();
})();
</script>
</body>
</html>
