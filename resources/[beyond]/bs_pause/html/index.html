<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bs_pause</title>
<link rel="stylesheet" href="style.css?v=20261029-alpha-keyboard">
</head>
<body>
<div id="pause" class="pause hidden">
    <div class="shade"></div>
    <aside class="side">
        <div class="brand alpha-brand"><span>ALPHA-</span><b>Z</b></div>
        <div class="paused" data-t="p.paused">PAUSED</div>
        <nav id="nav"></nav>
        <div class="foot" data-t="p.hint_esc">ESC to resume</div>
    </aside>
    <main id="main" class="main"></main>
    <div id="confirm" class="confirm hidden">
        <div class="box"><p id="confirmText"></p>
            <div class="row"><button id="cNo" class="btn"></button><button id="cYes" class="btn danger"></button></div>
        </div>
    </div>
</div>
<script src="nui://bs_ui/html/shared/palette.js?v=20261016a"></script>
<script src="app.js?v=20261029-alpha-keyboard"></script>
</body>
</html>
