<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<audio id="bow" preload="auto" src="crossbow_shot.wav"></audio>
<script>
const audio = document.getElementById('bow');
window.addEventListener('message', (e) => {
  if (!e.data || e.data.action !== 'playCrossbow') return;
  const sound = audio.cloneNode();
  sound.volume = Math.max(0, Math.min(1, Number(e.data.volume) || 0.5));
  sound.play().catch(() => {});
  sound.addEventListener('ended', () => sound.remove(), {once:true});
});
</script></body></html>
