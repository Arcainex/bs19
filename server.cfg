## BeyondSurvival - server.cfg
## Fill in the lines marked CHANGEME before the first start.
## If you deployed with the txAdmin recipe, the license key, database and your
## admin account were filled in for you already.
## Never share this file once it has your key and password in it.

# License key from https://portal.cfx.re
sv_licenseKey "CHANGEME"

# MariaDB / MySQL. Create an empty database first, the framework creates the tables itself.
set mysql_connection_string "mysql://CHANGEME_USER:CHANGEME_PASSWORD@127.0.0.1/beyondsurvival?charset=utf8mb4"

# Optional: Steam profile lookups (https://steamcommunity.com/dev/apikey)
set steam_webApiKey ""

# ----------------------------------------------------------------------------
# Network
# ----------------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 48
sv_scriptHookAllowed 0

# Game build the framework is tested on. Change only if you know why.
sv_enforceGameBuild 3095

# OneSync is turned on in txAdmin (Settings -> FXServer), not here.
# No ambient NPCs or traffic - the world is supposed to be empty.
set onesync_population false

# ----------------------------------------------------------------------------
# Server info (shown in the server list)
# ----------------------------------------------------------------------------
sv_hostname "[BS19] - BeyondSurvival Framework (bs19.org)"
sets sv_projectName "[BS19] - BeyondSurvival Framework (bs19.org)"
sets sv_projectDesc "BeyondSurvival is a free survival framework for developers or just players looking to have fun in the apocalyptic atmosphere of Los Santos"
sets tags "survival, zombies, apocalypse, post-apocalyptic, rpg, pve, pvp, loot, building, factions, bases, hardcore, free, framework, standalone, beyondsurvival, bs19"
sets locale "en-US"
load_server_icon myLogo.png

# ----------------------------------------------------------------------------
# Pool sizes - needed by the apocalypse map (lots of props)
# ----------------------------------------------------------------------------
increase_pool_size "Building" 500
increase_pool_size "StaticBounds" 2000
increase_pool_size "EntityDescPool" 5000
increase_pool_size "TxdStore" 8000
increase_pool_size "FragmentStore" 4000
increase_pool_size "fragInstGta" 800
increase_pool_size "Object" 800
increase_pool_size "InteriorProxy" 200
increase_pool_size "PortalInst" 100
increase_pool_size "OcclusionInteriorInfo" 20
increase_pool_size "OcclusionPathNode" 2000
increase_pool_size "OcclusionPortalEntity" 300
increase_pool_size "OcclusionPortalInfo" 300
increase_pool_size "LightEntity" 400
increase_pool_size "AttachmentExtension" 200

# ----------------------------------------------------------------------------
# Database driver
# ----------------------------------------------------------------------------
ensure oxmysql

# ----------------------------------------------------------------------------
# BeyondSurvival (bs_core must stay first)
# ----------------------------------------------------------------------------
ensure bs_loading
ensure bs_core
ensure bs_esx_bridge
ensure bs_multichar
ensure bs_tutorial
ensure bs_admin
ensure bs_config
ensure bs_assets
ensure bs_ui
ensure bs_pause
ensure bs_chat
ensure bs_radial
ensure bs_bodily
ensure bs_interactions
ensure bs_inventory
ensure bs_crafting
ensure bs_skills
ensure bs_economy
ensure bs_medical
ensure bs_emotes
ensure bs_scenes
ensure bs_weapons
ensure bs_vehicles
ensure bs_menu
ensure bs_vip
ensure bs_building
ensure bs_recycler
ensure bs_mining
ensure bs_stash
ensure bs_extraction
ensure bs_factions
ensure bs_faction_bases
ensure bs_scoreboard
ensure bs_world

# Zombies (the crawl anims must start before bs_zombies)
ensure nutria_crawl_anims
ensure bs_zombiepeds
ensure bs_zombies
ensure bs_zombiesfx
ensure bs_atlas
ensure bs_traders
ensure bs_jobs
ensure nodes

ensure bs_boosters
ensure bs_gadgets
ensure bs_drugs
ensure bs_events
ensure bs_operations
ensure bs_guard

# Optional, off by default: remove ## to enable
## ensure bs_radio
## ensure bs_cinecam

# Map and extras
## The map is not included. After installing The Apocalypse Project (https://github.com/Arcainex/The-Apocalypse-Project) in resources/[map], remove the ## below.
## ensure [the_apocalypse_project]
ensure chadada_apocalypse_cars

# ----------------------------------------------------------------------------
# Permissions
# group.admin       = staff (F1 config menu, /atlas, admin menu, debug commands)
# group.superadmin  = owner (everything admin has + destructive commands)
# ----------------------------------------------------------------------------
add_ace group.admin command.zombiemenu allow
add_ace group.admin bs.admin allow
add_ace group.superadmin bs.superadmin allow
add_ace group.superadmin bs.owner allow
add_ace group.superadmin command allow
add_principal group.superadmin group.admin

# Your admins. Replace CHANGEME with the player's license (shown in txAdmin ->
# Players, or in the server console when they join). One line per person.
# add_principal identifier.license:CHANGEME group.superadmin
# add_principal identifier.license:CHANGEME group.admin
